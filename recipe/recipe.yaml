schema_version: 1

context:
  version: "1.28.9"

package:
  name: gst-rtsp-server
  version: ${{ version }}

source:
  - url: https://gstreamer.freedesktop.org/src/gst-rtsp-server/gst-rtsp-server-${{ version }}.tar.xz
    sha256: b87ed564d857a226a3135bd2c42eae7b40eb64031cb9cbce124722af92cc8b9d

build:
  number: 1

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - ${{ compiler('cxx') }}
    - pkgconfig
    - meson
    - ninja
    - gettext-tools
    - gobject-introspection
    - if: build_platform != target_platform
      then: cross-python_${{ target_platform }}
    - python <${{ 3.15 }}
    - setuptools <81
  host:
    - pkgconfig
    - meson
    - ninja
    - gstreamer ==${{ version }}
    - gst-plugins-base ==${{ version }}
    - glib
    - if: not linux
      then: libintl-devel <1
    - libiconv
    - zlib
  run:
    - gstreamer ==${{ version }}
    - gst-plugins-base ==${{ version }}
    - if: not ppc64le
      then:
        - libsoup
        - glib-networking
  ignore_run_exports:
    from_package:
      - if: build_platform != target_platform
        then:
          - python
          - python_abi
tests:
  - script:
      - if: unix
        then:
          - test -f $PREFIX/include/gstreamer-1.0/gst/rtsp-server/rtsp-server.h
          - test -f $PREFIX/lib/libgstrtspserver-1.0${SHLIB_EXT}
          - test -f $PREFIX/lib/gstreamer-1.0/libgstrtspclientsink${SHLIB_EXT}
      - if: win
        then:
          - if not exist %LIBRARY_INC%\\gstreamer-1.0\\gst\\rtsp-server\\rtsp-server.h exit 1
          - if not exist %LIBRARY_BIN%\\gstrtspserver-1.0-0.dll exit 1
          - if not exist %LIBRARY_LIB%\\gstreamer-1.0\\gstrtspclientsink.dll exit 1
          - gst-inspect-1.0 --plugin rtspclientsink

about:
  summary: GStreamer RTSP Server
  description: |
    GStreamer RTSP Server is a library on top of GStreamer for building an RTSP server.
  license: LGPL-2.1-or-later
  license_file: COPYING
  homepage: http://gstreamer.freedesktop.org/
  repository: https://gitlab.freedesktop.org/gstreamer/gstreamer/-/tree/main/subprojects/gst-rtsp-server
  documentation: https://gstreamer.freedesktop.org/modules/gst-rtsp-server.html

extra:
  recipe-maintainers:
    - tjwilli58
